name: CI

on:
  push:
    branches: ["master", "main"]
    tags: ["*.*.*", "v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.ref_name }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PLEX_MUSIC_PLAYER_PLAYBACK_BACKEND: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev]'
      - name: Run tests
        run: ./scripts/run_tests.sh
      - name: Run lint
        run: ./scripts/run_lint.sh

  test-windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PLEX_MUSIC_PLAYER_PLAYBACK_BACKEND: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create virtualenv
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -e ".[dev]"
      - name: Run targeted Windows tests
        run: |
          $env:PYTHONPATH = "$pwd\src"
          .venv\Scripts\python -m pytest `
            tests/contract/test_mpv_loader.py `
            tests/unit/test_system_media.py
      - name: Run lint
        run: |
          $env:PYTHONPATH = "$pwd\src"
          .venv\Scripts\python -m ruff check src tests

  package-linux:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [test, test-windows]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Normalize artifact tag for manual runs
        if: github.event_name == 'workflow_dispatch'
        run: echo "RELEASE_TAG=manual-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv2
      - name: Install packaging dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[packaging]'
      - name: Build Linux artifact
        run: ./scripts/build_nuitka_linux.sh
      - name: Archive Linux artifact
        run: |
          tar -C build/nuitka -czf build/nuitka/PlexMusicPlayer-linux-x86_64.tar.gz PlexMusicPlayer.AppDir
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlexMusicPlayer-linux-x86_64
          path: build/nuitka/PlexMusicPlayer-linux-x86_64.tar.gz
          if-no-files-found: error

  package-macos:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    needs: [test, test-windows]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Normalize artifact tag for manual runs
        if: github.event_name == 'workflow_dispatch'
        run: echo "RELEASE_TAG=manual-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Install system dependencies
        run: brew install mpv
      - name: Install packaging dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[packaging]'
      - name: Build macOS artifact
        run: ./scripts/build_nuitka_macos.sh
      - name: Archive macOS artifact
        run: |
          ditto -c -k --sequesterRsrc --keepParent "build/nuitka/Plex Music Player.app" build/nuitka/PlexMusicPlayer-macos.zip
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlexMusicPlayer-macos
          path: build/nuitka/PlexMusicPlayer-macos.zip
          if-no-files-found: error

  package-windows:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 180
    needs: [test, test-windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Normalize artifact tag for manual runs
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          "RELEASE_TAG=manual-$env:GITHUB_RUN_NUMBER" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install system dependencies
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like 'mpv-dev-x86_64-*.7z' } | Select-Object -First 1
          if (-not $asset) {
            throw "Unable to locate mpv dev asset in latest shinchiro release"
          }
          $archivePath = Join-Path $env:RUNNER_TEMP $asset.name
          $extractDir = Join-Path $env:RUNNER_TEMP "mpv-dev"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archivePath
          if (Test-Path $extractDir) {
            Remove-Item -LiteralPath $extractDir -Recurse -Force
          }
          7z x $archivePath "-o$extractDir" | Out-Null
          $mpvDll = Get-ChildItem -LiteralPath $extractDir -Filter "libmpv-2.dll" -File -Recurse -ErrorAction Stop |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $mpvDll) {
            throw "Unable to locate libmpv-2.dll after extracting mpv dev archive"
          }
          "PLEX_MUSIC_PLAYER_MPV_LIBRARY=$mpvDll" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Create virtualenv
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -e ".[packaging]"
      - name: Build Windows bundle
        shell: pwsh
        env:
          PLEX_MUSIC_PLAYER_NUITKA_VERBOSE: "1"
        run: .\scripts\build_nuitka_windows.ps1
      - name: Verify packaged MPV backend
        shell: pwsh
        run: .\tools\windows_remote_verify.ps1
      - name: Package Windows artifact
        shell: pwsh
        run: |
          mkdir dist
          Compress-Archive -Path "build\nuitka\PlexMusicPlayer.dist\*" -DestinationPath "dist\PlexMusicPlayer-${env:RELEASE_TAG}-windows-x86_64.zip" -Force
      - name: Build Windows installer
        shell: pwsh
        run: .\scripts\build_windows_installer.ps1
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlexMusicPlayer-windows-x86_64
          path: |
            dist/PlexMusicPlayer-${{ env.RELEASE_TAG }}-windows-x86_64.zip
            dist/PlexMusicPlayer-${{ env.RELEASE_TAG }}-windows-x86_64-setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [package-linux, package-macos, package-windows]
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: PlexMusicPlayer-linux-x86_64
          path: release-assets
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: PlexMusicPlayer-macos
          path: release-assets
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: PlexMusicPlayer-windows-x86_64
          path: release-assets
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
