name: CI

on:
  push:
    branches: ["master", "main"]
    tags: ["*.*.*", "v*.*.*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PLEX_MUSIC_PLAYER_PLAYBACK_BACKEND: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev]'
      - name: Run tests
        run: ./scripts/run_tests.sh
      - name: Run lint
        run: ./scripts/run_lint.sh

  package-linux:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: test
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv2
      - name: Install packaging dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[packaging]'
      - name: Build Linux artifact
        run: ./scripts/build_nuitka_linux.sh
      - name: Archive Linux artifact
        run: |
          tar -C build/nuitka -czf build/nuitka/PlexMusicPlayer-linux-x86_64.tar.gz PlexMusicPlayer.AppDir
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlexMusicPlayer-linux-x86_64
          path: build/nuitka/PlexMusicPlayer-linux-x86_64.tar.gz
          if-no-files-found: error

  package-macos:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    needs: test
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: brew install mpv
      - name: Install packaging dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[packaging]'
      - name: Build macOS artifact
        run: ./scripts/build_nuitka_macos.sh
      - name: Archive macOS artifact
        run: |
          ditto -c -k --sequesterRsrc --keepParent "build/nuitka/Plex Music Player.app" build/nuitka/PlexMusicPlayer-macos.zip
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlexMusicPlayer-macos
          path: build/nuitka/PlexMusicPlayer-macos.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [package-linux, package-macos]
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: PlexMusicPlayer-linux-x86_64
          path: release-assets
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: PlexMusicPlayer-macos
          path: release-assets
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
